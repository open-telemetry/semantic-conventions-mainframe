name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Link Check ─────────────────────────────────────────────────────
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed for merge-base used in modified-files mode
          persist-credentials: false

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Check links for pull requests
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: mise run links

      - name: Check links for pushes and merge queues
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run links

  # ── Model Checks ───────────────────────────────────────────────────
  policies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared version pins
        id: versions
        shell: bash
        run: |
          weaver_version="$(sed -n 's/^WEAVER_VERSION=v\{0,1\}//p' versions.env)"
          if [[ -z "$weaver_version" ]]; then
            echo "Failed to load WEAVER_VERSION from versions.env" >&2; exit 1
          fi
          echo "weaver_version=$weaver_version" >> "$GITHUB_OUTPUT"

      - name: Install Weaver
        uses: open-telemetry/weaver/.github/actions/setup-weaver@f8e1b42fbd1e09df5263c26b7df6011eaafd454d
        with:
          version: '${{ steps.versions.outputs.weaver_version }}'

      - name: Validate model
        run: make check-policies

  generated-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared version pins
        id: versions
        shell: bash
        run: |
          weaver_version="$(sed -n 's/^WEAVER_VERSION=v\{0,1\}//p' versions.env)"
          if [[ -z "$weaver_version" ]]; then
            echo "Failed to load WEAVER_VERSION from versions.env" >&2; exit 1
          fi
          echo "weaver_version=$weaver_version" >> "$GITHUB_OUTPUT"

      - name: Install Weaver
        uses: open-telemetry/weaver/.github/actions/setup-weaver@f8e1b42fbd1e09df5263c26b7df6011eaafd454d
        with:
          version: '${{ steps.versions.outputs.weaver_version }}'

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Regenerate and check committed outputs are in sync
        run: |
          rm -rf ./docs/registry
          make generate-all WEAVER=weaver
          if ! git diff --exit-code -- ./docs/registry; then
            echo "FAIL: committed generated outputs are out of sync!"
            echo "Run 'make generate-all' and commit the changes."
            exit 1
          fi
          untracked=$(git ls-files --others --exclude-standard -- ./docs/registry)
          if [ -n "$untracked" ]; then
            echo "FAIL: untracked files under generated outputs:"
            echo "$untracked"
            exit 1
          fi
          echo "OK: committed generated outputs are up to date"

  # ── Lint / Format / Unit tests ─────────────────────────────────────
  reference-python-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: reference
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "reference/**/uv.lock"

      - name: Lint Python
        run: uv tool run --from ruff ruff check

      - name: Check Python formatting
        run: uv tool run --from ruff ruff format --check

  reference-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared version pins
        id: versions
        uses: ./.github/actions/load-version-pins

      # Scenario tests resolve model/ with weaver.
      - name: Install Weaver
        uses: open-telemetry/weaver/.github/actions/setup-weaver@f8e1b42fbd1e09df5263c26b7df6011eaafd454d
        with:
          version: '${{ steps.versions.outputs.weaver_version }}'

      - uses: ./.github/actions/setup-reference-tooling

      - name: Materialize upstream semconv dependency
        run: make filter-upstream

      - name: Run unit tests
        working-directory: reference
        run: uv run --locked --extra dev pytest

  author-self-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Author Self-Review Check
        run: |
          if git grep -Fq "<!-- I'm an AI agent!!! -->" -- '*.md' ':!AGENTS.md' ':!CLAUDE.md' || \
             git grep -Fq "# I'm an AI agent!!!" -- '*.yaml' '*.yml' ':!.github/workflows/ci.yml'; then
            echo "The PR author (a human) must review the changes."
            exit 1
          fi

  # ── Discover scenario matrices ─────────────────────────────────────
  reference-scenario-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrices.outputs.matrix }}
    defaults:
      run:
        working-directory: reference
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-reference-tooling

      - name: Generate matrices
        id: matrices
        run: echo "matrix=$(uv run run-scenario --print-ci-matrix)" >> "$GITHUB_OUTPUT"

  # ── Scenario Tests ──────────────────────────────────────
  reference-scenarios:
    runs-on: ubuntu-latest
    needs: reference-scenario-matrix
    # An empty matrix is an error, so the job is skipped while there are no scenarios.
    if: needs.reference-scenario-matrix.outputs.matrix != '{"scenario":[]}'
    timeout-minutes: 20
    defaults:
      run:
        working-directory: reference
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.reference-scenario-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared version pins
        id: versions
        uses: ./.github/actions/load-version-pins

      - name: Install Weaver
        uses: open-telemetry/weaver/.github/actions/setup-weaver@f8e1b42fbd1e09df5263c26b7df6011eaafd454d
        with:
          version: '${{ steps.versions.outputs.weaver_version }}'

      - uses: ./.github/actions/setup-reference-tooling

      - name: Materialize upstream semconv dependency
        working-directory: .
        run: make filter-upstream

      - name: Run implementation scenario
        env:
          SCENARIO_LIB: ${{ matrix.scenario.lib }}
        run: uv run run-scenario "$SCENARIO_LIB" --strict

      - name: Check data file is up to date
        env:
          SCENARIO_DATA: ${{ matrix.scenario.data }}
        run: |
          git diff --exit-code -- "$SCENARIO_DATA"
          untracked=$(git ls-files --others --exclude-standard -- "$SCENARIO_DATA")
          if [ -n "$untracked" ]; then echo "Untracked data files: $untracked"; exit 1; fi

  # ── Status Report ───────────────────────────────────────────────────
  reference-status-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: reference
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared version pins
        id: versions
        uses: ./.github/actions/load-version-pins

      # The reports are built from weaver's resolution of model/, which is
      # resolved on demand rather than committed.
      - name: Install Weaver
        uses: open-telemetry/weaver/.github/actions/setup-weaver@f8e1b42fbd1e09df5263c26b7df6011eaafd454d
        with:
          version: '${{ steps.versions.outputs.weaver_version }}'

      - uses: ./.github/actions/setup-reference-tooling

      - name: Materialize upstream semconv dependency
        working-directory: .
        run: make filter-upstream

      - name: Generate status report
        run: uv run --locked update-reports

      - name: Check status report is up to date
        run: |
          git diff --exit-code -- README.md reports/
          untracked=$(git ls-files --others --exclude-standard -- reports/)
          if [ -n "$untracked" ]; then echo "Untracked report pages: $untracked"; exit 1; fi

  # ── Aggregate gate for branch protection ───────────────────────────
  required-status-check:
    if: always()
    needs:
      - links
      - policies
      - generated-docs
      - reference-python-lint
      - reference-unit-tests
      - author-self-review
      - reference-scenario-matrix
      - reference-scenarios
      - reference-status-report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any dependency did not pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        # reference-scenarios is skipped, not failed, while reference/scenarios/
        # holds no scenario; a failed matrix job is caught on its own.
        run: |
          not_passed=$(jq -r 'to_entries[]
            | select(.value.result != "success")
            | select(.key != "reference-scenarios" or .value.result != "skipped")
            | "\(.key): \(.value.result)"' <<<"$NEEDS")
          if [ -n "$not_passed" ]; then
            echo "$not_passed"
            exit 1
          fi
