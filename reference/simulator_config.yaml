apiVersion: semconv.simulation/v1alpha1
kind: SimulatorConfig
metadata:
  name: mainframe-semconv-verification
spec:
  registry:
    # upstream_path: optional path to the upstream OTel Semantic Conventions
    # v1 registry (groups: format). The simulator loads metric stubs from here
    # so that metric_refinements: ref: entries can be resolved into emittable
    # MetricDef objects without duplicating upstream definitions in the local
    # v2 model.
    # Populated by `make filter-upstream` — points at .build/sc-upstream-filtered/
    upstream_path: "../.build/sc-upstream-filtered"

    # Local v2 model paths (relative to this config file)
    paths:
      - "../model/mainframe"
      - "../model/virtualization"
    schema_format: definition/2

  sampling_interval: 10.0

  selection:
    signals: [metrics, logs]
    include_namespaces:
      # Local v2 mainframe and virtualization metrics
      - "^mainframe\\..*"
      - "^virtualization\\..*"
      # Upstream base metrics resolved via metric_refinements:
      - "^system\\..*"
      - "^hw\\..*"
      - "^container\\..*"
    min_stability: development

  topology:
    entities:
      # -----------------------------------------------------------------------
      # IBM z16 Central Processor Complex (CPC)
      # Modelled as virtualization.platform — the canonical entity for CPC-level
      # metrics (mainframe.host.* signals carry entity_associations:
      # [virtualization.platform]).
      # -----------------------------------------------------------------------
      - type: virtualization.platform
        identity:
          virtualization.platform.id: "IBM-3931-0000000000045A01"
        attributes:
          virtualization.platform.name: "CPC01"
          virtualization.system.name: "ibm.prsm"
          host.id: "IBM-3931-0000000000045A01"
          host.name: "CPC01"
          mainframe.machine.model: "704"
          mainframe.machine.type: "3931"
        children:
          # Production z/OS LPAR
          - type: virtualization.partition
            identity:
              virtualization.partition.id: "01"
            attributes:
              virtualization.partition.name: "PROD01"
              virtualization.system.name: "ibm.prsm"
              mainframe.lpar.number: 1
            children:
              # --- CPUs: all valid mainframe.cpu.type enum values ---
              - type: mainframe.cpu
                identity:
                  mainframe.cpu.id: "0"
                attributes:
                  mainframe.cpu.name: "CP0"
                  mainframe.cpu.type: "cp"
              - type: mainframe.cpu
                identity:
                  mainframe.cpu.id: "1"
                attributes:
                  mainframe.cpu.name: "CP1"
                  mainframe.cpu.type: "cp"
              - type: mainframe.cpu
                identity:
                  mainframe.cpu.id: "2"
                attributes:
                  mainframe.cpu.name: "zIIP0"
                  mainframe.cpu.type: "iip"
              - type: mainframe.cpu
                identity:
                  mainframe.cpu.id: "4"
                attributes:
                  mainframe.cpu.name: "ICF0"
                  mainframe.cpu.type: "icf"
              - type: mainframe.cpu
                identity:
                  mainframe.cpu.id: "5"
                attributes:
                  mainframe.cpu.name: "AAP0"
                  mainframe.cpu.type: "aap"
              - type: mainframe.cpu
                identity:
                  mainframe.cpu.id: "6"
                attributes:
                  mainframe.cpu.name: "SAP0"
                  mainframe.cpu.type: "sap"
              # --- Channels: all mainframe.channel.type enum values ---
              - type: mainframe.channel
                identity:
                  mainframe.channel.id: "1A"
                attributes:
                  mainframe.channel.type: "ficon"
              - type: mainframe.channel
                identity:
                  mainframe.channel.id: "1B"
                attributes:
                  mainframe.channel.type: "ficon"
              - type: mainframe.channel
                identity:
                  mainframe.channel.id: "2A"
                attributes:
                  mainframe.channel.type: "zhyperlink"
              - type: mainframe.channel
                identity:
                  mainframe.channel.id: "3A"
                attributes:
                  mainframe.channel.type: "osa"
              - type: mainframe.channel
                identity:
                  mainframe.channel.id: "4A"
                attributes:
                  mainframe.channel.type: "roce"
              - type: mainframe.channel
                identity:
                  mainframe.channel.id: "5A"
                attributes:
                  mainframe.channel.type: "coupling"
              # --- Adapters: all mainframe.adapter.type enum values ---
              - type: mainframe.adapter
                identity:
                  mainframe.adapter.id: "0140"
                attributes:
                  mainframe.adapter.type: "crypto"
                  mainframe.adapter.name: "CryptoExpress8S-1"
              - type: mainframe.adapter
                identity:
                  mainframe.adapter.id: "0180"
                attributes:
                  mainframe.adapter.type: "roce"
                  mainframe.adapter.name: "RoCE-Express3"
              - type: mainframe.adapter
                identity:
                  mainframe.adapter.id: "0200"
                attributes:
                  mainframe.adapter.type: "flash"
                  mainframe.adapter.name: "FlashExpress-1"
              - type: mainframe.adapter
                identity:
                  mainframe.adapter.id: "0220"
                attributes:
                  mainframe.adapter.type: "accelerator"
                  mainframe.adapter.name: "NNPAAccelerator-1"
              - type: mainframe.adapter
                identity:
                  mainframe.adapter.id: "0240"
                attributes:
                  mainframe.adapter.type: "network"
                  mainframe.adapter.name: "OSA-Express7S-1"
              - type: mainframe.adapter
                identity:
                  mainframe.adapter.id: "0260"
                attributes:
                  mainframe.adapter.type: "storage"
                  mainframe.adapter.name: "FICON-Express16S-1"
              # --- Physical adapter ports (for system.network.* refinements) ---
              - type: mainframe.adapter.port
                identity:
                  mainframe.adapter.port.id: "0180.P0"
                attributes:
                  mainframe.adapter.port.name: "RoCE-P0"
              - type: mainframe.adapter.port
                identity:
                  mainframe.adapter.port.id: "0240.P0"
                attributes:
                  mainframe.adapter.port.name: "OSA-P0"

          # z/VM Hypervisor Partition
          - type: virtualization.partition
            identity:
              virtualization.partition.id: "02"
            attributes:
              virtualization.partition.name: "ZVM01"
              virtualization.system.name: "ibm.prsm"
              mainframe.lpar.number: 2
            children:
              - type: mainframe.cpu
                identity:
                  mainframe.cpu.id: "3"
                attributes:
                  mainframe.cpu.name: "IFL0"
                  mainframe.cpu.type: "ifl"
              # Virtual NIC (DPM) for system.network.* refinements
              - type: mainframe.partition.nic
                identity:
                  mainframe.partition.nic.id: "NIC01"
                attributes:
                  mainframe.partition.nic.name: "NIC01"

          # Virtualization Hypervisor & Guests (z/VM)
          - type: virtualization.hypervisor
            identity:
              virtualization.hypervisor.id: "ZVM01"
            attributes:
              virtualization.hypervisor.name: "ZVM01"
              virtualization.system.name: "ibm.zvm"
            children:
              - type: virtualization.vswitch
                identity:
                  virtualization.vswitch.id: "VSW1"
                attributes:
                  virtualization.vswitch.name: "VSWITCH1"
              - type: virtualization.vm
                identity:
                  virtualization.vm.id: "LINUX01"
                attributes:
                  virtualization.vm.name: "LINUX01"
                  virtualization.system.name: "ibm.zvm"
              - type: virtualization.vm
                identity:
                  virtualization.vm.id: "LINUX02"
                attributes:
                  virtualization.vm.name: "LINUX02"
                  virtualization.system.name: "ibm.zvm"

          # Storage and Resource Pools
          - type: virtualization.storage_pool
            identity:
              virtualization.storage_pool.id: "POOL01"
            attributes:
              virtualization.storage_pool.name: "ECKD_POOL_01"
              virtualization.system.name: "ibm.prsm"
          - type: virtualization.resource_pool
            identity:
              virtualization.resource_pool.id: "RPOOL01"
            attributes:
              virtualization.resource_pool.name: "GENERAL_COMPUTE"
              virtualization.system.name: "ibm.prsm"

      # Sysplex cluster (for virtualization.cluster.* metrics)
      - type: virtualization.cluster
        identity:
          virtualization.cluster.id: "CLUSTER01"
        attributes:
          virtualization.cluster.name: "IBM-Z-Sysplex-PROD"

  workload_profile_ref: "./workload_profile.yaml"

  exporter:
    otlp:
      http_endpoint: "http://localhost:4318"
