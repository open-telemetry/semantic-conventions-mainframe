# Grafana datasource provisioning — automatically creates the Prometheus
# datasource used by all mainframe dashboards.
#
# The datasource uid must match the ${DS_PROMETHEUS} template variable
# embedded in every dashboard JSON file under dashboards/mainframe/.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: DS_PROMETHEUS
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
