# A tiny `weaver registry resolve --v2` output: two entities (one refined),
# two metrics of this registry and three refinements, two of which share the
# wire name system.cpu.utilization. Only `refinements` is read by the tooling.
schema_url: https://opentelemetry.io/schemas/fixture/0.0.1
registry: {}
refinements:
  spans: []
  events: []
  entities:
    - id: virtualization.platform
      type: virtualization.platform
      identity:
        - {key: virtualization.platform.id, type: string, examples: ["3931-45A01"], requirement_level: recommended}
      description:
        - {key: host.name, type: string, requirement_level: recommended}
    - id: refinement.mainframe.host.virtualization.platform
      type: virtualization.platform
      identity:
        - {key: virtualization.platform.id, type: string, requirement_level: recommended}
      description:
        - {key: host.name, type: string, requirement_level: recommended}
        - {key: mainframe.host.machine_type, type: string, examples: ["3931"], requirement_level: opt_in}
    - id: mainframe.cpu
      type: mainframe.cpu
      identity:
        - {key: mainframe.cpu.name, type: string, examples: ["CP02"], requirement_level: recommended}
        - {key: virtualization.platform.id, type: string, requirement_level: recommended}
      description:
        - key: mainframe.cpu.type
          type: {members: [{id: cp, value: cp}, {id: ifl, value: ifl}]}
          requirement_level: recommended
  metrics:
    - id: mainframe.cpu.utilization
      name: mainframe.cpu.utilization
      instrument: gauge
      unit: "1"
      entity_associations: [mainframe.cpu]
      annotations: {code_generation: {metric_value_type: double}}
      attributes:
        - {key: mainframe.cpu.name, type: string, requirement_level: required}
    - id: mainframe.host.cpu.active.count
      name: mainframe.host.cpu.active.count
      instrument: updowncounter
      unit: "{cpu}"
      entity_associations: [virtualization.platform]
      annotations: {code_generation: {metric_value_type: int}}
      attributes:
        - key: mainframe.cpu.type
          type: {members: [{id: cp, value: cp}, {id: ifl, value: ifl}]}
          requirement_level: required
    - id: refinement.virtualization.hw.host.power
      name: hw.host.power
      instrument: gauge
      unit: W
      entity_associations: [virtualization.platform]
      attributes:
        - {key: hw.id, type: string, examples: ["cpc"], requirement_level: required}
        - {key: hw.name, type: string, requirement_level: recommended}
    - id: refinement.mainframe.system.cpu.utilization
      name: system.cpu.utilization
      instrument: gauge
      unit: "1"
      entity_associations: [virtualization.platform]
      attributes:
        - key: cpu.mode
          type: {members: [{id: user, value: user}, {id: system, value: system}]}
          requirement_level: recommended
        - key: mainframe.cpu.type
          type: {members: [{id: cp, value: cp}, {id: ifl, value: ifl}]}
          requirement_level: required
    - id: refinement.fixture.cpu.system.cpu.utilization
      name: system.cpu.utilization
      instrument: gauge
      unit: "1"
      entity_associations: [mainframe.cpu]
      attributes:
        - key: cpu.mode
          type: {members: [{id: user, value: user}, {id: system, value: system}]}
          requirement_level: {conditionally_required: if available}
