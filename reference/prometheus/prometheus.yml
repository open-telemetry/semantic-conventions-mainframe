# Prometheus configuration for the Mainframe semconv demo stack.
#
# Scrapes the OTel Collector's Prometheus exporter endpoint every 15 seconds.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    job: mainframe-semconv

scrape_configs:
  - job_name: mainframe-otelcol
    static_configs:
      - targets: ["otelcol:8889"]
    # The OTel Collector prometheus exporter exposes metrics with the job
    # label set to the service.name resource attribute ("weaver" by default).
    # We relabel here to keep the Grafana dashboard job filter working.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "mainframe_.+"
        action: keep
