[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "semconv-mainframe-reference"
version = "0.1.0"
description = "Reference scenarios that validate the OpenTelemetry Semantic Conventions for Mainframe with Weaver live-check"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff==0.17.0",
    "mypy==2.4.0",
]

[project.scripts]
update-reports = "semconv_mainframe.report:main"
run-scenario = "semconv_mainframe.run_scenario:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    ".cache",
    ".ruff_cache",
    "scenarios/*/results",
]

[tool.ruff.lint]
select = ["B", "BLE", "E4", "E7", "E9", "F", "I", "PIE", "RUF", "SIM", "UP", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["semconv_mainframe*"]
