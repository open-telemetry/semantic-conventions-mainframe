# Mainframe Semantic Conventions — local observability stack
#
# Starts:
#   otelcol     — OpenTelemetry Collector (OTLP gRPC :4317, prometheus exporter :8889)
#   prometheus  — Prometheus (scrapes otelcol :8889, UI :9090)
#   grafana     — Grafana (pre-provisioned datasource + 6 mainframe dashboards, UI :3000)
#
# Run from the repository root:
#   make stack-up     # start the stack
#   make stack-emit   # send synthetic telemetry into the running stack
#   make stack-down   # stop and remove containers
#   make demo         # stack-up + emit + print Grafana URL (one command)
#
# Or directly from this directory:
#   podman-compose -f reference/docker-compose.yaml up -d
#
# Grafana login: admin / admin (change via GRAFANA_ADMIN_PASSWORD env var)

services:
  otelcol:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:${OTELCOL_VERSION}
    container_name: mainframe-otelcol
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otelcol/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"    # OTLP gRPC receiver (weaver registry emit target)
      - "4318:4318"    # OTLP HTTP receiver
      - "8889:8889"    # Prometheus metrics exporter (scraped by prometheus)
    networks:
      - mainframe-obs

  prometheus:
    image: docker.io/prom/prometheus:${PROMETHEUS_VERSION}
    container_name: mainframe-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otelcol
    networks:
      - mainframe-obs

  grafana:
    image: docker.io/grafana/grafana:${GRAFANA_VERSION}
    container_name: mainframe-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards/mainframe:/var/lib/grafana/dashboards/mainframe:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - mainframe-obs

volumes:
  prometheus-data:
  grafana-data:

networks:
  mainframe-obs:
    driver: bridge
