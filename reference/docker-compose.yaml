version: '3.8'

services:
  # 1. OpenTelemetry Collector Gateway
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTELCOL_VERSION:-0.113.0}
    container_name: otel-collector
    command: ["--config=/etc/otelcol-config.yaml"]
    volumes:
      - ./otelcol-config.yaml:/etc/otelcol-config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC — loopback-only: unauthenticated ingestion
      - "127.0.0.1:4318:4318" # OTLP HTTP — loopback-only: unauthenticated ingestion
      - "127.0.0.1:8889:8889" # Prometheus scrape endpoint — loopback-only
    networks:
      - semconv-net

  # 2. Prometheus Timeseries Storage
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v2.55.0}
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=otlp-write-receive
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"  # loopback-only: unauthenticated administrative endpoint
    networks:
      - semconv-net

  # 3. Grafana Visualisation
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.3.0}
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "127.0.0.1:3000:3000"  # loopback-only: anonymous Admin is enabled for dev convenience
    depends_on:
      - prometheus
    networks:
      - semconv-net

networks:
  semconv-net:
    driver: bridge
