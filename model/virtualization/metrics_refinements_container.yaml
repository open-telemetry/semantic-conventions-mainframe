file_format: definition/2
# Class B — metric_refinements for upstream container.* metrics.
#
# The upstream container.* metrics associate with the `container` entity.
# No local virtualization entity refines `container`; a VM is not a container.
# These refinements re-anchor each metric on virtualization.vm by overriding
# entity_associations and adding virtualization.vm.id as a required attribute.
#
# The ref: field names the upstream metric being extended.
# instrument, unit, and name are NOT redeclared — they are inherited from the
# upstream definition via ref:.
#
# Reference: virtualization-metrics.md §container.* — Class B

metric_refinements:
  # -------------------------------------------------------------------------
  # container.uptime → virtualization.vm
  # -------------------------------------------------------------------------
  - id: refinement.virtualization.container.uptime
    ref: container.uptime
    brief: "Time the virtual machine has been running."
    stability: development
    entity_associations:
      - virtualization.vm
    attributes:
      - ref: virtualization.vm.id
        requirement_level: required
        note: >
          The unique identifier of the virtual machine this uptime measurement
          belongs to.

  # -------------------------------------------------------------------------
  # container.cpu.time → virtualization.vm
  # -------------------------------------------------------------------------
  - id: refinement.virtualization.container.cpu.time
    ref: container.cpu.time
    brief: "CPU time consumed by the virtual machine."
    stability: development
    entity_associations:
      - virtualization.vm
    attributes:
      - ref: virtualization.vm.id
        requirement_level: required
        note: >
          The unique identifier of the virtual machine this CPU time
          measurement belongs to.
      - ref: cpu.mode
        requirement_level:
          conditionally_required: >
            Required if mode is available.
        note: >
          Following modes SHOULD be used for VMs if available: `user`, `system`.

  # -------------------------------------------------------------------------
  # container.cpu.usage → virtualization.vm
  # -------------------------------------------------------------------------
  - id: refinement.virtualization.container.cpu.usage
    ref: container.cpu.usage
    brief: "CPU usage of the virtual machine, measured in cpus."
    stability: development
    entity_associations:
      - virtualization.vm
    attributes:
      - ref: virtualization.vm.id
        requirement_level: required
        note: >
          The unique identifier of the virtual machine this CPU usage
          measurement belongs to.
      - ref: cpu.mode
        requirement_level:
          conditionally_required: >
            Required if mode is available.
        note: >
          Following modes SHOULD be used for VMs if available: `user`, `system`.

