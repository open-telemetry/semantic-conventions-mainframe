file_format: definition/2
metrics:
  # ---------------------------------------------------------------------------
  # CPU
  # ---------------------------------------------------------------------------

  - name: virtualization.partition.cpu.utilization
    brief: "The fraction of time processors allocated to the firmware partition were busy executing work, as a ratio from 0 (idle) to 1 (fully utilised)."
    note: >
      Reports CPU utilization for a hardware or firmware enforced partition
      such as an IBM Z logical partition (LPAR) managed by PR/SM (Processor
      Resource/Systems Manager). Unlike `virtualization.vm.cpu.utilization`,
      this metric applies to partitions managed at the firmware level rather
      than by a software hypervisor. In IBM Z PR/SM (classic mode) this maps
      to the processor-usage fields in the logical-partition-usage metric group
      from the HMC Web Services API. The `virtualization.partition.cpu.type`
      attribute breaks down utilization by processor specialisation type
      (cp, ifl, icf, iip, etc.). Analogous to
      `mainframe.partition.cpu.utilization` in the mainframe namespace.
    instrument: gauge
    unit: "1"
    stability: development
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: double
    entity_associations:
      - virtualization.partition
    attributes:
      - ref: virtualization.partition.id
        requirement_level: required
      - ref: virtualization.partition.cpu.type
        requirement_level: recommended
        note: >
          Identifies the processor type whose utilization is being reported.
          Use `all` for an aggregate across all types. Omit on platforms
          that do not differentiate by processor type.

  - name: virtualization.partition.cpu.count
    brief: "The number of virtual processors of the specified type currently allocated to the firmware partition."
    note: >
      Reports the current virtual processor allocation for the partition. In
      IBM Z PR/SM (classic mode) this maps to the processor-count-* fields on
      the logical-partition or partition object in the HMC Web Services API.
      Analogous to `mainframe.partition.cpu.virtual.count` in the mainframe
      namespace.
    instrument: updowncounter
    unit: "{vcpu}"
    stability: development
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: int
    entity_associations:
      - virtualization.partition
    attributes:
      - ref: virtualization.partition.id
        requirement_level: required
      - ref: virtualization.partition.cpu.type
        requirement_level: recommended
        note: >
          Identifies the processor type being counted. Use `all` for the
          total count across all processor types.

  # ---------------------------------------------------------------------------
  # Memory
  # ---------------------------------------------------------------------------

  - name: virtualization.partition.memory.size
    brief: "The amount of memory allocated to the firmware partition, in mebibytes (MiB)."
    note: >
      Reports the memory allocation for the partition as configured at the
      platform level. In IBM Z PR/SM (classic mode) this corresponds to the
      initial-memory or current central storage allocation reported by the
      HMC Web Services API logical-partition or partition object. Analogous
      to `mainframe.partition.memory.size` in the mainframe namespace.
    instrument: gauge
    unit: "MiBy"
    stability: development
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: int
    entity_associations:
      - virtualization.partition
    attributes:
      - ref: virtualization.partition.id
        requirement_level: required

  # ---------------------------------------------------------------------------
  # State
  # ---------------------------------------------------------------------------

  - name: virtualization.partition.state.code
    brief: "The operational state of the firmware partition encoded as a numeric gauge (1=in this state, 0=not in this state)."
    note: >
      Reports the current lifecycle state of the partition. For each partition,
      exactly one state value will be 1 at any given time; all others will be 0.
      This encoding enables Prometheus alerting rules and state-change detection
      without label-value cardinality issues. In IBM Z PR/SM (classic mode) this
      maps to the status field reported by the HMC Web Services API for the
      logical partition object. Valid state values are defined by the
      `virtualization.partition.state` attribute enum (active, not_activated,
      stopped, unknown). Analogous to `mainframe.partition.status.code` in
      the mainframe namespace.
    instrument: gauge
    unit: "1"
    stability: development
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: int
    entity_associations:
      - virtualization.partition
    attributes:
      - ref: virtualization.partition.id
        requirement_level: required
      - ref: virtualization.partition.state
        requirement_level: required
        note: >
          The state whose membership is being reported. One record per state
          value is emitted per partition; the value is 1 for the current
          state and 0 for all others.
