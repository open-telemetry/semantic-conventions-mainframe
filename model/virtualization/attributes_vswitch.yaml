file_format: definition/2
attributes:
  - key: virtualization.vswitch.id
    type: string
    stability: development
    brief: "Unique identifier for the virtual network switch."
    examples: ["3931-45A01/ZVM1/VSWITCH1", "3931-45A01/104.P0.OSD"]
    note: >
      Uniquely identifies the virtual switch across management domains.
      Distributed switches span hosts, so the hypervisor is not part of the
      identifier for them.

      - IBM z/VM: the hypervisor (`virtualization.hypervisor.id`) and the VSWITCH
        name, e.g. `3931-45A01/ZVM1/VSWITCH1`.
      - IBM Z DPM: the CPC (`virtualization.platform.id`) and the virtual switch
        name, e.g. `3931-45A01/104.P0.OSD`.
      - VMware vSphere: the distributed switch UUID; for a standard vSwitch, the
        host hardware UUID and the switch name.
      - KVM / libvirt: the host machine ID and the bridge or Open vSwitch name.

  - key: virtualization.vswitch.name
    type: string
    stability: development
    brief: "The human-readable name assigned to the virtual network switch."
    examples: ["VSWITCHA", "dvSwitch-prod", "br-internal"]
    note: >
      The name as configured in the hypervisor management interface. For
      IBM Z z/VM this is the VSWITCH name defined in the CP directory. For
      IBM Z DPM mode this is the virtual switch name reported by the HMC
      Web Services API. For VMware vSphere this is the switch name shown
      in vCenter.
