file_format: definition/2
# Metric refinements for upstream system.* metrics in the mainframe domain.

metric_refinements:
  # -------------------------------------------------------------------------
  # system.cpu.utilization — add mainframe.cpu.type and mainframe.cpu.sharing.mode
  # -------------------------------------------------------------------------
  - id: refinement.mainframe.system.cpu.utilization
    ref: system.cpu.utilization
    brief: "Per-logical-CPU utilization by mode, extended for IBM Z processor specialization."
    stability: development
    entity_associations:
      - virtualization.platform
      - virtualization.partition
    attributes:
      - ref: mainframe.cpu.type
        requirement_level: required
        note: >
          IBM Z processor specialisation type (cp, ifl, ziip, icf, sap, cbp, aap).
          Maps to HMC CPC and logical partition usage fields.
      - ref: mainframe.cpu.sharing.mode
        requirement_level: opt_in
        note: >
          Indicates whether the utilization measurement represents shared or dedicated
          processors.

  # -------------------------------------------------------------------------
  # system.cpu.time — add mainframe.cpu.type and mainframe.cpu.sharing.mode
  # -------------------------------------------------------------------------
  - id: refinement.mainframe.system.cpu.time
    ref: system.cpu.time
    brief: "Seconds each logical CPU spent on each mode, extended for IBM Z processor specialization."
    stability: development
    entity_associations:
      - virtualization.platform
      - virtualization.partition
    attributes:
      - ref: mainframe.cpu.type
        requirement_level: required
        note: >
          IBM Z processor specialisation type (cp, ifl, ziip, icf, sap, cbp, aap).
      - ref: mainframe.cpu.sharing.mode
        requirement_level: opt_in
        note: >
          Indicates whether the CPU time represents shared or dedicated processor execution.

  # -------------------------------------------------------------------------
  # system.paging.operations — add mainframe.zvm.paging.type
  # -------------------------------------------------------------------------
  - id: refinement.mainframe.system.paging.operations
    ref: system.paging.operations
    brief: "Number of paging operations, extended for IBM z/VM hypervisor storage tiers."
    stability: development
    entity_associations:
      - virtualization.partition
    attributes:
      - ref: system.paging.direction
        requirement_level: required
        note: >
          Direction of paging operation: in or out.
      - ref: mainframe.zvm.paging.type
        requirement_level: required
        note: >
          Identifies the z/VM storage tier (central, expanded, dasd).
