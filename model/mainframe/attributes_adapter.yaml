file_format: definition/2
attributes:
  - key: mainframe.adapter.name
    type: string
    stability: development
    annotations:
      hmc_source:
        sources:
          - type: object_property
            object: adapter
            field: adapter-id
            mode: all
    brief: "The name of the I/O adapter in the form CSS.Chpid."
    examples: ["0.00", "0.2D", "1.E3"]
    note: >
      The channel subsystem (CSS) index and channel path identifier (CHPID) are
      concatenated with a dot separator, e.g., "0.2D" for CSS 0, CHPID 2D.
      Reported by the HMC Web Services API adapter object field `adapter-id`.

  - key: mainframe.adapter.type
    stability: development
    annotations:
      hmc_source:
        sources:
          - type: object_property
            object: adapter
            field: type
            mode: all
    brief: "The type of the mainframe I/O adapter card."
    note: >
      Reported by the HMC Web Services API adapter object field `type`.
      Used to distinguish network, storage, cryptographic, and accelerator
      adapters when aggregating per-type utilization metrics.
    type:
      members:
        - id: crypto
          value: "crypto"
          brief: "A cryptographic (crypto) adapter, providing hardware-accelerated encryption and key management."
          stability: development
        - id: flash
          value: "flash"
          brief: "A Flash Express adapter, providing solid-state storage for IBM Virtual Flash Memory (VFM)."
          stability: development
        - id: roce
          value: "roce"
          brief: "A RDMA over Converged Ethernet (RoCE) adapter, providing low-latency RDMA networking over Ethernet."
          stability: development
        - id: accelerator
          value: "accelerator"
          brief: "An accelerator adapter, providing hardware acceleration for specific workloads such as compression or AI inference."
          stability: development
        - id: network
          value: "network"
          brief: "A network adapter providing connectivity to external networks."
          stability: development
        - id: storage
          value: "storage"
          brief: "A storage adapter providing connectivity to external storage systems such as SAN or NVMe-oF."
          stability: development

  - key: mainframe.adapter.owning.partition
    type: string
    stability: development
    annotations:
      hmc_source:
        sources:
          - type: object_property
            object: adapter
            field: partitions-assigned-to-adapter
            mode: dpm
    brief: "The name of the logical partition (LPAR) that owns the I/O adapter when dedicated, or 'shared' when the adapter is shared across partitions."
    examples: ["LPAR01", "shared"]
    note: >
      Derived from the IBM Z HMC Web Services API adapter object property
      `partitions-assigned-to-adapter`, an array of assigned-partition-info
      objects. Set to 'shared' when more than one partition is assigned.

  - key: mainframe.smc.type
    stability: development
    brief: "The variant of the IBM Shared Memory Communications (SMC) protocol used for the data transfer."
    note: >
      Shared Memory Communications (SMC) has two variants: SMC-D uses the
      Internal Shared Memory (ISM) virtual PCI device for intra-CPC
      communication, while SMC-R uses RDMA over Converged Ethernet (RoCE)
      for inter-CPC or CPC-to-external communication. No IBM Z HMC Web Services
      API source is currently known for this attribute — SC27-2646-01 declares no
      SMC telemetry metric group. Populate it from an in-band source. In
      distributed systems terms, these are analogous to shared-memory IPC and
      RDMA transports respectively.
    type:
      members:
        - id: smc_d
          value: "smc_d"
          brief: "SMC-D — Shared Memory Communications over the Internal Shared Memory (ISM) direct device, used for intra-CPC communication."
          stability: development
        - id: smc_r
          value: "smc_r"
          brief: "SMC-R — Shared Memory Communications over RDMA via RoCE (RDMA over Converged Ethernet), used for inter-CPC or external communication."
          stability: development
