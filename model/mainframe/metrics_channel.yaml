file_format: definition/2
metrics:
  # ---------------------------------------------------------------------------
  # Channel utilization (per CHPID, from channel-usage metric group)
  # ---------------------------------------------------------------------------
  - name: mainframe.channel.utilization
    brief: "The fraction of time the I/O channel path was busy processing I/O, as a ratio from 0 (idle) to 1 (fully utilised)."
    note: >
      Reported by the IBM Z HMC Web Services API channel-usage metric group
      field `channel-usage` (classic mode). A channel path identifier (CHPID)
      is the unique identifier for a hardware I/O channel. Use the
      `mainframe.channel.name` attribute in CSS.CHPID format to identify
      the specific channel path. In distributed systems terms, this is
      analogous to the link utilization of a network interface or storage
      HBA port.
    instrument: gauge
    unit: "1"
    stability: development
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: double
      hmc_source:
        sources:
          - type: metric_group
            name: channel-usage
            field: channel-usage
            mode: classic
    entity_associations:
      - mainframe.channel
    attributes:
      - ref: mainframe.channel.name
        requirement_level: required
      - ref: mainframe.channel.mode
        requirement_level: recommended

  # ---------------------------------------------------------------------------
  # zHyperLink latency (per CHPID, from zhyperlink-telemetry)
  # ---------------------------------------------------------------------------
  - name: mainframe.channel.latency
    brief: "The average I/O operation latency on the specified channel path, in seconds."
    note: >
      Reported by the IBM Z HMC Web Services API for zHyperLink channel paths.
      zHyperLink is a PCIe-based ultra-low latency I/O channel that provides
      sub-20-microsecond synchronous read access to attached storage. Use the
      `mainframe.channel.name` attribute to identify the specific channel path
      and `disk.io.direction` to distinguish read from write operations. In
      distributed systems terms, this is analogous to NVMe or RDMA operation
      latency on a high-speed storage interconnect.
    instrument: gauge
    unit: "s"
    stability: development
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: double
      hmc_source:
        sources:
          - type: metric_group
            name: zhyperlink-telemetry
            field: read-latency-seconds
            mode: all
          - type: metric_group
            name: zhyperlink-telemetry
            field: write-latency-seconds
            mode: all
    entity_associations:
      - mainframe.channel
    attributes:
      - ref: mainframe.channel.name
        requirement_level: required
      - ref: disk.io.direction
        requirement_level: required
