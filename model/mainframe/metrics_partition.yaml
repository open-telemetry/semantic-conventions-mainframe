file_format: definition/2
metrics:
  # Partition virtual processor count. One possible source is the partition
  # metrics of the IBM Z HMC Web Services API.
  - name: mainframe.partition.cpu.virtual.count
    brief: "The number of virtual processors of the specified type allocated to an active logical partition (LPAR)."
    note: >
      Reported by the IBM Z HMC Web Services API partition object. In
      distributed systems terms, this is analogous to the vCPU count
      of a virtual machine.
    instrument: updowncounter
    unit: "{cpu}"
    stability: development
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: int
    entity_associations:
      - mainframe.partition
    attributes:
      - ref: mainframe.cpu.type
        requirement_level: required

  # Processor capping metrics
  - name: mainframe.partition.cpu.is_capped
    brief: "Indicates whether absolute capping is enabled for processors of the specified type allocated to the logical partition (LPAR) (0=false, 1=true)."
    note: >
      When absolute capping is enabled the partition cannot exceed the capped
      processor count regardless of spare capacity on the system. Reported by
      the IBM Z HMC Web Services API partition object.
    instrument: gauge
    unit: "1"
    stability: development
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: int
    entity_associations:
      - mainframe.partition
    attributes:
      - ref: mainframe.cpu.type
        requirement_level: required

  - name: mainframe.partition.cpu.capped.count
    brief: "The maximum number of processors of the specified type the logical partition (LPAR) may use when absolute capping is enabled, otherwise 0."
    note: >
      Reported by the IBM Z HMC Web Services API partition object.
      A value of 0 indicates that absolute capping is not enabled for
      this processor type.
    instrument: updowncounter
    unit: "{cpu}"
    stability: development
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: int
    entity_associations:
      - mainframe.partition
    attributes:
      - ref: mainframe.cpu.type
        requirement_level: required

  # Reserved processors
  - name: mainframe.partition.cpu.reserved.count
    brief: "The number of processors of the specified type reserved for the active logical partition (LPAR)."
    note: >
      Reserved processors are allocated to the partition but not yet in active
      use. Reported by the IBM Z HMC Web Services API partition object.
    instrument: updowncounter
    unit: "{cpu}"
    stability: development
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: int
    entity_associations:
      - mainframe.partition
    attributes:
      - ref: mainframe.cpu.type
        requirement_level: required

  # Partition weight
  - name: mainframe.partition.cpu.weight.value
    brief: "The processor scheduling weight of the active logical partition (LPAR)."
    note: >
      The weight determines the proportion of available processor cycles
      allocated to this partition relative to other partitions. Reported by
      the IBM Z HMC Web Services API partition object.
    instrument: gauge
    unit: "1"
    stability: development
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: int
    entity_associations:
      - mainframe.partition
    attributes:
      - ref: mainframe.partition.weight.type
        requirement_level: required
        note: >
          Identifies the weight category: initial (baseline weight at activation),
          minimum (floor), current (active weight), or maximum (ceiling when spare
          capacity is available).

  - name: mainframe.partition.cpu.weight.is_capped
    brief: "Indicates whether the initial central processor (CP) processing weight of the logical partition (LPAR) is capped (0=false, 1=true)."
    note: >
      When capped, the partition cannot exceed its initial weight even when
      spare capacity is available. Reported by the IBM Z HMC Web Services API
      partition object.
    instrument: gauge
    unit: "1"
    stability: development
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: int
    entity_associations:
      - mainframe.partition
