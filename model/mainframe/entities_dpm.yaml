file_format: definition/2
entities:
  - type: mainframe.port
    brief: >
      A physical port on a mainframe network adapter in Dynamic Partition
      Manager (DPM) mode — the mainframe equivalent of a physical port on
      a multi-port NIC or switch.
    stability: development
    requirement_level: recommended
    identity:
      - ref: mainframe.adapter.name
        note: >
          The name of the adapter that contains this port, in CSS.CHPID format.
      - ref: mainframe.port.id
    description:
      - ref: host.name
        requirement_level: recommended
        note: >
          The name of the Central Processing Complex (CPC) that owns the adapter
          hosting this port.

  - type: mainframe.nic
    brief: >
      A virtual network interface card (NIC) attached to a logical partition
      (LPAR) in Dynamic Partition Manager (DPM) mode — the mainframe equivalent
      of a vNIC attached to a virtual machine.
    stability: development
    requirement_level: recommended
    identity:
      - ref: mainframe.partition.name
        note: >
          The name of the DPM partition that owns this NIC.
      - ref: mainframe.nic.name
    description:
      - ref: host.name
        requirement_level: recommended
        note: >
          The name of the Central Processing Complex (CPC) that hosts the
          partition owning this NIC.
      - ref: mainframe.adapter.name
        requirement_level: recommended
        note: >
          The name of the physical adapter backing this virtual NIC.
      - ref: mainframe.port.id
        requirement_level: recommended
        note: >
          The port ID on the physical adapter backing this virtual NIC.

  - type: mainframe.storage.group
    brief: >
      A DPM storage group — a named collection of block storage volumes
      of a single connectivity type (FCP, FC, or NVMe) that can be attached
      to one or more DPM partitions. Analogous to a Kubernetes StorageClass
      or a cloud storage pool.
    stability: development
    requirement_level: recommended
    identity:
      - ref: mainframe.storage.group.name
    description:
      - ref: host.name
        requirement_level: recommended
        note: >
          The name of the Central Processing Complex (CPC) that owns this
          storage group.
      - ref: mainframe.storage.group.type
        requirement_level: required

  - type: mainframe.storage.volume
    brief: >
      A DPM storage volume — a single unit of block storage (LUN, ECKD DASD
      cylinder set, or NVMe namespace) within a storage group. Analogous to
      a Kubernetes Persistent Volume or a cloud block storage volume.
    stability: development
    requirement_level: recommended
    identity:
      - ref: mainframe.storage.group.name
        note: >
          The name of the storage group that contains this volume.
      - ref: mainframe.storage.volume.name
    description:
      - ref: host.name
        requirement_level: recommended
        note: >
          The name of the Central Processing Complex (CPC) that owns the
          storage group containing this volume.
