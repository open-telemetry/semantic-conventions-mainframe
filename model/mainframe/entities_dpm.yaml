file_format: definition/2
entities:
  - type: mainframe.adapter.port
    brief: >
      A physical port on a mainframe network adapter in Dynamic Partition
      Manager (DPM) mode — the mainframe equivalent of a physical port on
      a multi-port NIC or switch.
    stability: development
    requirement_level: recommended
    identity:
      - ref: virtualization.platform.id
        note: >
          The Central Processing Complex (CPC) the adapter is installed in.
      - ref: mainframe.adapter.id
        note: >
          The PCHID of the adapter that contains this port.
      - ref: mainframe.adapter.port.id
    description:
      - ref: host.name
        requirement_level: recommended
        note: >
          The name of the Central Processing Complex (CPC) that owns the adapter
          hosting this port.

  - type: mainframe.partition.nic
    brief: >
      A virtual network interface card (NIC) attached to a logical partition
      (LPAR) in Dynamic Partition Manager (DPM) mode — the mainframe equivalent
      of a vNIC attached to a virtual machine.
    stability: development
    requirement_level: recommended
    identity:
      - ref: virtualization.platform.id
        note: >
          The Central Processing Complex (CPC) that hosts the partition.
      - ref: virtualization.partition.id
        note: >
          The DPM partition that owns this NIC (on IBM Z, its partition name).
      - ref: mainframe.partition.nic.name
    description:
      - ref: host.name
        requirement_level: recommended
        note: >
          The name of the Central Processing Complex (CPC) that hosts the
          partition owning this NIC.
      - ref: mainframe.adapter.id
        requirement_level: recommended
        note: >
          The PCHID of the physical adapter backing this virtual NIC.
      - ref: mainframe.adapter.port.id
        requirement_level: recommended
        note: >
          The port ID on the physical adapter backing this virtual NIC.
