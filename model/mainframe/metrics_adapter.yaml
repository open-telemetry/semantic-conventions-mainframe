file_format: definition/2
metrics:
  # Adapter utilization metrics. One possible source is the Adapter metric group
  # of the IBM Z HMC Web Services API.
  - name: mainframe.adapter.utilization
    brief: "The fraction of time the adapter was busy processing I/O, as a ratio from 0 (idle) to 1 (fully utilised)."
    note: >
      Reported by the IBM Z HMC Web Services API adapter metric group.
      In distributed systems terms, this is analogous to the utilization of
      a network interface card (NIC) or storage host bus adapter (HBA).
    instrument: gauge
    unit: "1"
    stability: development
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: double
    entity_associations:
      - mainframe.adapter
    attributes:
      - ref: mainframe.adapter.type
        requirement_level: required
