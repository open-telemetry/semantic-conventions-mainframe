file_format: definition/2
# Metric refinements for upstream network metrics in the mainframe domain.

metric_refinements:
  # -------------------------------------------------------------------------
  # system.network.io (Physical Adapter Port)
  # -------------------------------------------------------------------------
  - id: refinement.mainframe.port.system.network.io
    ref: system.network.io
    brief: "Network bytes transmitted and received through the mainframe physical adapter port."
    stability: development
    annotations:
      hmc_source:
        sources:
          - type: metric_group
            name: network-physical-adapter-port
            field: bytes-sent
            mode: dpm
          - type: metric_group
            name: network-physical-adapter-port
            field: bytes-received
            mode: dpm
    entity_associations:
      - mainframe.adapter.port
    attributes:
      - ref: network.io.direction
        requirement_level: required
        note: >
          Direction of network traffic: transmit or receive.
      - ref: mainframe.adapter.port.id
        requirement_level: required
        note: >
          Physical network port identifier on the adapter.

  # -------------------------------------------------------------------------
  # system.network.packet.count (Physical Adapter Port)
  # -------------------------------------------------------------------------
