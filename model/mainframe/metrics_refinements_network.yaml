file_format: definition/2
# Metric refinements for upstream network metrics in the mainframe domain.

metric_refinements:
  # -------------------------------------------------------------------------
  # system.network.io (Physical Adapter Port)
  # -------------------------------------------------------------------------
  - id: refinement.mainframe.port.system.network.io
    ref: system.network.io
    brief: "Network bytes transmitted and received through the mainframe physical adapter port."
    stability: development
    entity_associations:
      - mainframe.adapter.port
    attributes:
      - ref: network.io.direction
        requirement_level: required
        note: >
          Direction of network traffic: transmit or receive.
      - ref: mainframe.adapter.port.id
        requirement_level: required
        note: >
          Physical network port identifier on the adapter.

  # -------------------------------------------------------------------------
  # system.network.packet.count (Physical Adapter Port)
  # -------------------------------------------------------------------------
  - id: refinement.mainframe.port.system.network.packet.count
    ref: system.network.packet.count
    brief: "Network packets transferred through the mainframe physical adapter port."
    stability: development
    entity_associations:
      - mainframe.adapter.port
    attributes:
      - ref: network.io.direction
        requirement_level: required
      - ref: mainframe.adapter.port.id
        requirement_level: required

  # -------------------------------------------------------------------------
  # system.network.packet.dropped (Physical Adapter Port)
  # -------------------------------------------------------------------------
  - id: refinement.mainframe.port.system.network.packet.dropped
    ref: system.network.packet.dropped
    brief: "Network packets dropped on the mainframe physical adapter port."
    stability: development
    entity_associations:
      - mainframe.adapter.port
    attributes:
      - ref: network.io.direction
        requirement_level: required
      - ref: mainframe.adapter.port.id
        requirement_level: required

  # -------------------------------------------------------------------------
  # system.network.errors (Physical Adapter Port)
  # -------------------------------------------------------------------------
  - id: refinement.mainframe.port.system.network.errors
    ref: system.network.errors
    brief: "Count of network errors detected on the mainframe physical adapter port."
    stability: development
    entity_associations:
      - mainframe.adapter.port
    attributes:
      - ref: network.io.direction
        requirement_level: required
      - ref: mainframe.adapter.port.id
        requirement_level: required

  # -------------------------------------------------------------------------
  # system.network.io (Partition Virtual NIC)
  # -------------------------------------------------------------------------
  - id: refinement.mainframe.nic.system.network.io
    ref: system.network.io
    brief: "Network bytes transmitted and received through the partition virtual NIC."
    stability: development
    entity_associations:
      - mainframe.partition.nic
    attributes:
      - ref: network.io.direction
        requirement_level: required
      - ref: mainframe.partition.nic.name
        requirement_level: required
        note: >
          The virtual NIC identifier attached to the partition.

  # -------------------------------------------------------------------------
  # system.network.packet.count (Partition Virtual NIC)
  # -------------------------------------------------------------------------
  - id: refinement.mainframe.nic.system.network.packet.count
    ref: system.network.packet.count
    brief: "Network packets transferred through the partition virtual NIC."
    stability: development
    entity_associations:
      - mainframe.partition.nic
    attributes:
      - ref: network.io.direction
        requirement_level: required
      - ref: mainframe.partition.nic.name
        requirement_level: required

  # -------------------------------------------------------------------------
  # system.network.packet.dropped (Partition Virtual NIC)
  # -------------------------------------------------------------------------
  - id: refinement.mainframe.nic.system.network.packet.dropped
    ref: system.network.packet.dropped
    brief: "Network packets dropped on the partition virtual NIC."
    stability: development
    entity_associations:
      - mainframe.partition.nic
    attributes:
      - ref: network.io.direction
        requirement_level: required
      - ref: mainframe.partition.nic.name
        requirement_level: required

  # -------------------------------------------------------------------------
  # system.network.errors (Partition Virtual NIC)
  # -------------------------------------------------------------------------
  - id: refinement.mainframe.nic.system.network.errors
    ref: system.network.errors
    brief: "Count of network errors detected on the partition virtual NIC."
    stability: development
    entity_associations:
      - mainframe.partition.nic
    attributes:
      - ref: network.io.direction
        requirement_level: required
      - ref: mainframe.partition.nic.name
        requirement_level: required

  # -------------------------------------------------------------------------
  # system.network.connection.count (Partition / Platform)
  # -------------------------------------------------------------------------
  - id: refinement.mainframe.system.network.connection.count
    ref: system.network.connection.count
    brief: "Number of active network connections for the mainframe partition or platform."
    stability: development
    entity_associations:
      - virtualization.platform
      - virtualization.partition
    attributes:
      - ref: network.connection.state
        requirement_level: required
        note: >
          TCP connection state (for example: established, listen, time_wait, close_wait).
      - ref: mainframe.partition.name
        requirement_level: opt_in
