metric_refinements:
  # mainframe.adapter.port.bytes.sent / received refine hw.network.io
  - id: refinement.mainframe.adapter.port.hw.network.io
    ref: hw.network.io
    brief: "Received and transmitted network traffic in bytes through the mainframe physical network adapter port."
    note: >
      Mainframe refinement of hw.network.io for the mainframe.adapter.port entity.
      Use network.io.direction to distinguish direction: 'transmit' maps to
      HMC field `bytes-sent`, 'receive' maps to `bytes-received`. Reported
      by the IBM Z HMC Web Services API network-physical-adapter-port metric
      group (DPM mode only, HMC ≥ 2.13.1).
    stability: development
    entity_associations:
      - mainframe.adapter.port
    attributes:
      - ref: network.io.direction
        requirement_level: required
        note: >
          Set to 'transmit' for bytes sent (HMC field `bytes-sent`),
          or 'receive' for bytes received (HMC field `bytes-received`).

  # mainframe.adapter.port.packets.sent / received refine hw.network.packets
  - id: refinement.mainframe.adapter.port.hw.network.packets
    ref: hw.network.packets
    brief: "Received and transmitted unicast network traffic in packets through the mainframe physical network adapter port."
    note: >
      Mainframe refinement of hw.network.packets for the mainframe.adapter.port entity.
      Use network.io.direction to distinguish direction: 'transmit' maps to
      HMC field `packets-sent`, 'receive' maps to `packets-received`. Reported
      by the IBM Z HMC Web Services API network-physical-adapter-port metric
      group (DPM mode only, HMC ≥ 2.13.1).
    stability: development
    entity_associations:
      - mainframe.adapter.port
    attributes:
      - ref: network.io.direction
        requirement_level: required
        note: >
          Set to 'transmit' for packets sent (HMC field `packets-sent`),
          or 'receive' for packets received (HMC field `packets-received`).

  # mainframe.adapter.port.bandwidth.utilization refines hw.network.bandwidth.utilization
  - id: refinement.mainframe.adapter.port.hw.network.bandwidth.utilization
    ref: hw.network.bandwidth.utilization
    brief: "Utilization of the network bandwidth as a fraction for the mainframe physical network adapter port."
    note: >
      Mainframe refinement of hw.network.bandwidth.utilization for the
      mainframe.adapter.port entity. Reported by the IBM Z HMC Web Services API
      network-physical-adapter-port metric group (DPM mode only, HMC ≥ 2.13.1)
      field `utilization`. Value ranges from 0 (idle) to 1 (fully utilised).
    stability: development
    entity_associations:
      - mainframe.adapter.port
    attributes: []
