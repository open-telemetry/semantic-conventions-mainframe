      Reported by the IBM Z HMC Web Services API network-physical-adapter-port
      metric group (DPM mode only, HMC ≥ 2.13.1) field `packets-received`.
    instrument: counter
    unit: "{packet}"
    stability: development
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: int
      hmc_source:
        sources:
          - type: metric_group
            name: network-physical-adapter-port
            field: packets-received
            mode: dpm
            min_hmc_version: "2.13.1"
    entity_associations:
      - mainframe.adapter.port

  - name: mainframe.adapter.port.packets.dropped
    brief: "The total number of packets dropped on the physical network adapter port due to resource shortage."
    note: >
      Reported by the IBM Z HMC Web Services API network-physical-adapter-port
      metric group (DPM mode only, HMC ≥ 2.13.1) fields `packets-sent-dropped`
      and `packets-received-dropped`. Use the `network.io.direction` attribute
      to distinguish sent vs. received drops.
      In distributed systems terms, this is analogous to `network.transmit_drop_total`
      / `network.receive_drop_total` on a NIC.
    instrument: counter
    unit: "{packet}"
    stability: development
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: int
      hmc_source:
        sources:
          - type: metric_group
            name: network-physical-adapter-port
            field: packets-sent-dropped
            mode: dpm
            min_hmc_version: "2.13.1"
    entity_associations:
      - mainframe.adapter.port
    attributes:
      - ref: network.io.direction
        requirement_level: required

  - name: mainframe.adapter.port.packets.discarded
    brief: "The total number of malformed packets discarded on the physical network adapter port."
    note: >
      Reported by the IBM Z HMC Web Services API network-physical-adapter-port
