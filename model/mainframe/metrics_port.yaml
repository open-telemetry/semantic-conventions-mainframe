    instrument: counter
    unit: "{packet}"
    stability: development
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: int
      hmc_source:
        sources:
          - type: metric_group
            name: network-physical-adapter-port
            field: packets-sent-discarded
            mode: dpm
            min_hmc_version: "2.13.1"
