  - name: mainframe.nic.packets.dropped
    brief: "The total number of packets dropped on the virtual network interface card (NIC) attached to the partition due to resource shortage."
    note: >
      Reported by the IBM Z HMC Web Services API partition-attached-network-interface
      metric group (DPM mode only, HMC ≥ 2.13.1) fields `packets-sent-dropped`
      and `packets-received-dropped`. Use the `network.io.direction` attribute
      to distinguish sent vs. received drops.
    instrument: counter
    unit: "{packet}"
    stability: development
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: int
      hmc_source:
        sources:
