file_format: definition/2
metrics:
  # Partition-attached NIC metrics.
  # Source: partition-attached-network-interface metric group of the HMC Web Services API
  # (DPM mode only, HMC >= 2.13.1).
  # Prometheus exporter prefix: zhmc_nic_

  - name: mainframe.partition.nic.bytes.sent
    brief: "The total number of bytes in unicast packets sent through the virtual network interface card (NIC) attached to the partition."
    note: >
      Reported by the IBM Z HMC Web Services API partition-attached-network-interface
      metric group (DPM mode only, HMC ≥ 2.13.1) field `bytes-sent`.
    instrument: counter
    unit: "By"
    stability: development
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: int
      hmc_source:
        sources:
          - type: metric_group
            name: partition-attached-network-interface
            field: bytes-sent
            mode: dpm
            min_hmc_version: "2.13.1"
    entity_associations:
      - mainframe.partition.nic

    attributes:
      - ref: mainframe.partition.name
        requirement_level: required
        note: >
          The name of the partition that owns this virtual NIC.
          Required to distinguish time series between partitions
          on the same Central Processing Complex (CPC).
          HMC source: partition object field `name`.
      - ref: mainframe.partition.nic.name
        requirement_level: required
        note: >
          The name of the virtual NIC this measurement belongs to.
          Required to distinguish time series between multiple NICs
          attached to the same partition.
          HMC source: partition-attached-network-interface field `nic-id`.

