metric_refinements:
  # mainframe.partition.nic.bytes.sent / received refine hw.network.io
  - id: refinement.mainframe.partition.nic.hw.network.io
    ref: hw.network.io
    brief: "Received and transmitted network traffic in bytes through the mainframe virtual NIC."
    note: >
      Mainframe refinement of hw.network.io for the mainframe.partition.nic
      entity (DPM mode only, HMC ≥ 2.13.1). Use network.io.direction to
      distinguish direction: 'transmit' maps to HMC field `bytes-sent`,
      'receive' maps to HMC field `bytes-received`. The mainframe-specific
      metrics mainframe.partition.nic.bytes.sent and
      mainframe.partition.nic.bytes.received carry the same information at
      IBM Z HMC resolution; this refinement enables cross-platform consumers
      that understand hw.network.io to include mainframe virtual NIC traffic.
    stability: development
    entity_associations:
      - mainframe.partition.nic
    attributes:
      - ref: mainframe.partition.name
        requirement_level: required
        note: >
          The name of the partition that owns this virtual NIC.
          Required to distinguish time series between partitions
          on the same Central Processing Complex (CPC).
          HMC source: partition object field `name`.
      - ref: mainframe.partition.nic.name
        requirement_level: required
        note: >
          The name of the virtual NIC this measurement belongs to.
          Required to distinguish time series between multiple NICs
          attached to the same partition.
          HMC source: partition-attached-network-interface field `nic-id`.
      - ref: network.io.direction
        requirement_level: required
        note: >
          Set to 'transmit' for bytes sent (HMC field `bytes-sent`),
          or 'receive' for bytes received (HMC field `bytes-received`).

  # mainframe.partition.nic.packets.sent / received refine hw.network.packets
  - id: refinement.mainframe.partition.nic.hw.network.packets
    ref: hw.network.packets
    brief: "Received and transmitted network traffic in packets through the mainframe virtual NIC."
    note: >
      Mainframe refinement of hw.network.packets for the mainframe.partition.nic
      entity (DPM mode only, HMC ≥ 2.13.1). Use network.io.direction to
      distinguish direction: 'transmit' maps to HMC field `packets-sent`,
      'receive' maps to HMC field `packets-received`. The mainframe-specific
      metrics mainframe.partition.nic.packets.sent and
      mainframe.partition.nic.packets.received carry the same information at
      IBM Z HMC resolution; this refinement enables cross-platform consumers
      that understand hw.network.packets to include mainframe NIC packet counts.
    stability: development
    entity_associations:
      - mainframe.partition.nic
    attributes:
      - ref: network.io.direction
        requirement_level: required
        note: >
          Set to 'transmit' for packets sent (HMC field `packets-sent`),
          or 'receive' for packets received (HMC field `packets-received`).
