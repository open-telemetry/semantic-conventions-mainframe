file_format: definition/2
attributes:
  - key: mainframe.channel.name
    type: string
    stability: development
    annotations:
      hmc_source:
        object: channel-path
        field: channel-path-id
        mode: all
    brief: "The name of the I/O channel in the form CSS.Chpid."
    examples: ["0.00", "0.2D", "1.E3"]
    note: >
      The channel subsystem (CSS) index and channel path identifier (CHPID) are
      concatenated with a dot separator, e.g., "0.2D" for CSS 0, CHPID 2D.
      Reported by the HMC Web Services API channel-path object.

  - key: mainframe.channel.mode
    stability: development
    annotations:
      hmc_source:
        object: channel-path
        field: chpid-type
        mode: all
    brief: "The operating mode of the I/O channel — either dedicated to a single partition or shared across partitions."
    type:
      members:
        - id: dedicated
          value: "dedicated"
          brief: "The I/O channel is dedicated to a specific partition and cannot be shared with other partitions."
          stability: development
        - id: shared
          value: "shared"
          brief: "The I/O channel can be shared among multiple partitions and is not dedicated to a specific partition."
          stability: development

  - key: mainframe.channel.owning.partition
    type: string
    stability: development
    annotations:
      hmc_source:
        object: channel-path
        field: owner-objects
        mode: all
    brief: "The name of the logical partition (LPAR) that owns the I/O channel when dedicated, or 'shared' when the channel is shared across partitions."
    examples: ["LPAR01", "shared"]
    note: >
      Reported by the HMC Web Services API channel-path object. Set to 'shared'
      when the channel is not dedicated to a single partition.
