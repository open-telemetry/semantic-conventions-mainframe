name: semantic-conventions-mainframe
description: >
  Semantic Conventions for Mainframes, including spans, metrics, 
  and events for IBM Z and LinuxONE software and infrastructure, 
  and vendor-specific conventions.
schema_url: https://opentelemetry.io/schemas/mainframe-dev/0.1.0-dev
stability: development
dependencies:
  # NOTE: This is a local filtered copy of the upstream OTel semantic conventions
  # at the version pinned in versions.env (SEMCONV_VERSION), with the gen-ai/,
  # mcp/, and openai/ subdirectories removed. This repo is the canonical home
  # for those conventions going forward; until upstream deletes its copies we
  # strip them here so Weaver does not see the same group ids defined in two
  # places. The Makefile target that produces `.build/sc-upstream-filtered` is
  # invoked automatically by every generate / check target (e.g.
  # `check-policies`, `generate-all`).
  #
  # The schema_url below is kept in sync with SEMCONV_VERSION automatically by
  # the filter-upstream Make target — do not edit it by hand.
  - schema_url: https://opentelemetry.io/schemas/1.42.0
    registry_path: ./.build/sc-upstream-filtered
