file_format: definition/2
entities:
  - type: zos.software
    brief: >
      A software service instance running on a z/OS system, such as
      a CICS region, an IMS subsystem, or a batch job.
    note: >
      **Breaking change from baseline:** The identity attribute was renamed from
      `mainframe.lpar.name` (used in the v1 registry.yaml baseline) to
      `mainframe.partition.name`. The new name aligns with the standardized
      `virtualization.partition` entity model and applies to both Classic LPAR
      and DPM partition modes. Existing emitters using `mainframe.lpar.name`
      must update to `mainframe.partition.name` to conform to this definition.
    stability: development
    requirement_level: recommended
    identity:
      - ref: zos.sysplex.name
      - ref: zos.smf.id
      - ref: mainframe.partition.name
